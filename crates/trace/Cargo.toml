[package]
name = "soe-trace"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Scoped timing spans for the Skyrim open engine, exported as Chrome trace events and a per-name summary"

[lib]
name = "soe_trace"
path = "src/lib.rs"

[dependencies]
tracy-client = { version = "0.19", optional = true, default-features = false, features = [
    "enable",
    "only-localhost",
    "ondemand",
] }
tracing = { version = "0.1", default-features = false, features = [
    "std",
    "release_max_level_info",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "registry",
    "env-filter",
] }
thiserror = "2"

[features]
default = []
tracy = ["dep:tracy-client"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
