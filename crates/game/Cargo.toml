[package]
name = "soe-game"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Runtime form table, the object model Papyrus sees, the first natives by vanilla call count, and the game clock that drives the VM"

[lib]
name = "soe_game"
path = "src/lib.rs"

[features]
save-fault-tests = ["soe-save/fault-injection"]

[dependencies]
thiserror = "2.0"
crc32fast = "1"
soe-trace = { path = "../trace" }
soe-esm = { path = "../esm" }
soe-papyrus = { path = "../papyrus" }
soe-bsa = { path = "../bsa" }
soe-navmesh = { path = "../navmesh" }
soe-moddata = { path = "../moddata" }
soe-profile = { path = "../profile" }
soe-commonlib-shim = { path = "../commonlib-shim" }
soe-save = { path = "../save" }
# Movement speeds, so the package driver and the character controller cannot
# disagree about how fast an actor walks. `physics` depends on `trace` and
# `nif` only, so there is no cycle.
soe-physics = { path = "../physics" }

[lints]
workspace = true
