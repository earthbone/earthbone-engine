[package]
name = "soe-game"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Runtime form table, the object model Papyrus sees, the first natives by vanilla call count, and the game clock that drives the VM"
autotests = false

[lib]
name = "soe_game"
path = "src/lib.rs"

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "scr_44_breaker2_adversarial"
path = "tests/scr_44_breaker2_adversarial.rs"

[[test]]
name = "scr_46_adversarial"
path = "tests/scr_46_breaker_adversarial.rs"

[[test]]
name = "scr_47_adversarial"
path = "tests/scr_47_breaker_adversarial.rs"

[[test]]
name = "scr_50_breaker2_adversarial"
path = "tests/scr_50_breaker2_adversarial.rs"

[features]
save-fault-tests = ["soe-save/fault-injection"]

[dependencies]
thiserror = "2.0"
crc32fast = "1"
soe-trace = { path = "../trace" }
soe-esm = { path = "../esm" }
soe-papyrus = { path = "../papyrus" }
soe-bsa = { path = "../bsa" }
soe-navmesh = { path = "../navmesh" }
soe-moddata = { path = "../moddata" }
soe-profile = { path = "../profile" }
soe-commonlib-shim = { path = "../commonlib-shim" }
soe-save = { path = "../save" }
soe-nif = { path = "../nif" }
soe-hkx = { path = "../hkx" }
soe-dds = { path = "../dds" }
soe-audio = { path = "../audio" }
# Movement speeds, so the package driver and the character controller cannot
# disagree about how fast an actor walks. `physics` depends on `trace` and
# `nif` only, so there is no cycle.
soe-physics = { path = "../physics" }
wasmtime = { version = "38", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "38", default-features = false, features = ["p2"] }

[lints]
workspace = true
