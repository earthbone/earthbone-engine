[package]
name = "soe-audio"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Skyrim voice and sound formats: FUZ containers, LIP tracks, the xWMA container, and open codecs beside them"

[lints]
workspace = true

[features]
default = ["vorbis", "opus"]
# Ogg Vorbis through lewton, a pure Rust decoder. On by default because a mod
# author may ship Vorbis instead of xWMA and the engine has to play it.
vorbis = ["dep:lewton", "dep:ogg"]
# Ogg and Switch NX Opus through opus-decoder, pure Rust and on by default.
opus = ["dep:ogg", "dep:opus-decoder"]
# Runs the optional `ffmpeg` comparison decoder. The default build uses the
# in-process `oxideav-wma` decoder and does not need an external program.
xwma-ffmpeg = []
# Mouth shapes from audio by running the `rhubarb` binary. Off by default for
# the same reason as ffmpeg: an engine build should not need a program to be
# installed, and the viseme types and the race mapping are useful with no
# tool present at all. Carries the JSON reader, so the default build does not
# pay for it.
rhubarb = ["dep:serde_json"]

[dependencies]
thiserror = "2"
soe-bsa = { path = "../bsa" }
# The race record carries the phoneme to morph target mapping a viseme track
# is played through, so the consumer can be tested here rather than only in
# whatever renders a face.
soe-esm = { path = "../esm" }
# Zero transitive dependencies, so reading the WAV a Creation Kit or a mod
# tool writes costs one crate and no decoder of our own.
hound = "3"
oxideav-core = "0.1.37"
oxideav-wma = "0.0.4"
lewton = { version = "0.10", optional = true }
# Pinned to the major lewton already uses, so the tree carries one copy of
# the Ogg page reader instead of two.
ogg = { version = "0.8", optional = true }
opus-decoder = { version = "0.1", optional = true }
# Only for reading what the rhubarb binary prints. Three crates, and only
# when that feature is on.
serde_json = { version = "1", optional = true }

[dev-dependencies]
soe-bsa = { path = "../bsa" }
