[package]
name = "soe-godot-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Godot 4 host for the open Skyrim engine: cell streaming, mesh and terrain builders"

# Cargo will not let a crate inherit `[lints] workspace = true` and then
# override one entry, so this restates the workspace clippy table by hand and
# sets its own `unsafe_code`, the only crate allowed the one `unsafe impl
# ExtensionLibrary` gdext requires. Keep this table in sync with
# `[workspace.lints.clippy]` in the root Cargo.toml when that changes.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
doc_markdown = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
return_self_not_must_use = "allow"
unreadable_literal = "allow"
cast_precision_loss = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
map_unwrap_or = "allow"
single_match_else = "allow"
explicit_iter_loop = "allow"
items_after_statements = "allow"
redundant_closure_for_method_calls = "allow"
struct_excessive_bools = "allow"
enum_glob_use = "allow"
zero_sized_map_values = "allow"
assigning_clones = "allow"
float_cmp = "allow"
format_push_string = "allow"
used_underscore_binding = "allow"
unused_self = "allow"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["godot"]
# The Godot node layer. Off, the crate is the pure streaming, mesh and terrain
# logic with no engine dependency, which is what the tests and the benchmark
# exercise.
godot = ["dep:godot"]
# Adds the SCR-24 synthetic renderer driver used by the live Godot regression.
scr-24-test = ["godot"]
# Uses ffmpeg as the host's xWMA decoder instead of the default in-process
# decoder. Kept for comparison with `soe-audio`'s native implementation.
xwma-ffmpeg = ["soe-audio/xwma-ffmpeg"]

[dependencies]
# godot-rust gdext 0.5.5 (crates.io 2026-08-09, matches engine-refs/gdext).
# api-4-4 is the floor because Jolt became the built-in physics in 4.4.
godot = { version = "0.5.5", features = ["api-4-4"], optional = true }
thiserror = "2"
soe-esm = { path = "../esm" }
soe-game = { path = "../game" }
soe-commonlib-shim = { path = "../commonlib-shim" }
soe-save = { path = "../save" }
soe-papyrus = { path = "../papyrus" }
soe-bsa = { path = "../bsa" }
soe-nif = { path = "../nif" }
soe-audio = { path = "../audio" }
soe-dds = { path = "../dds", features = ["encode"] }
soe-hkx = { path = "../hkx" }
soe-physics = { path = "../physics" }
soe-profile = { path = "../profile" }
soe-trace = { path = "../trace" }
rayon = "1.12"
soe-editor = { path = "../editor" }

[dev-dependencies]
tempfile = "3"
