[package]
name = "soe-nif"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Reader for Skyrim Special Edition NIF meshes with a renderer-neutral output"

[dev-dependencies]
soe-bsa = { path = "../bsa" }

[lints]
workspace = true

[lib]
name = "soe_nif"

[dependencies]
soe-trace = { path = "../trace" }
encoding_rs = "0.8"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
