[package]
name = "soe-bsa"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Bethesda BSA and BA2 archive reader with a load-order aware loose-file overlay"

[lints]
workspace = true

[dependencies]
soe-trace = { path = "../trace" }
byteorder = "1"
encoding_rs = "0.8"
flate2 = "1"
lz4_flex = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
