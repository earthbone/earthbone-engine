[package]
name = "soe-physics"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Havok collision shapes from Skyrim SE meshes, and the headless static collision world the simulation steps"

[lints]
workspace = true

[lib]
name = "soe_physics"

[dependencies]
soe-trace = { path = "../trace" }
soe-nif = { path = "../nif" }

[dev-dependencies]
soe-bsa = { path = "../bsa" }
# The gated cell walk needs a load order to find the Bannered Mare's
# references. Tests only, and `esm` depends on nothing here, so no cycle.
soe-esm = { path = "../esm" }
