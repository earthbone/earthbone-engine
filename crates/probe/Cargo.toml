[package]
name = "soe-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Vanilla Papyrus log probes and paired runtime comparisons"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
thiserror = "2"
soe-esm = { path = "../esm" }
soe-game = { path = "../game" }
soe-papyrus = { path = "../papyrus" }
soe-hkx = { path = "../hkx" }
soe-bsa = { path = "../bsa" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
