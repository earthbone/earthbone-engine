[package]
name = "soe-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.soe-esm]
path = "../crates/esm"

[dependencies.soe-bsa]
path = "../crates/bsa"

[dependencies.soe-nif]
path = "../crates/nif"

[dependencies.soe-havok]
path = "../crates/havok"

[dependencies.soe-dds]
path = "../crates/dds"

[dependencies.soe-papyrus]
path = "../crates/papyrus"

[dependencies.soe-save]
path = "../crates/save"

[[bin]]
name = "fuzz-esm"
path = "fuzz_targets/fuzz_esm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-bsa"
path = "fuzz_targets/fuzz_bsa.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-nif"
path = "fuzz_targets/fuzz_nif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-havok"
path = "fuzz_targets/fuzz_havok.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-dds"
path = "fuzz_targets/fuzz_dds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-pex"
path = "fuzz_targets/fuzz_pex.rs"
test = false
doc = false
bench = false

# Structure aware, next to the byte targets rather than replacing them. The
# byte targets reach the parser's error paths, these two reach the code behind
# a script that actually loads.
[[bin]]
name = "fuzz-pex-grammar"
path = "fuzz_targets/fuzz_pex_grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-vm-run"
path = "fuzz_targets/fuzz_vm_run.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-save"
path = "fuzz_targets/fuzz_save.rs"
test = false
doc = false
bench = false
