[package]
name = "soe-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
# The archive grammar target packs its own payloads, so it needs the same two
# codecs `soe-bsa` unpacks with. Both are already in that crate's tree, so this
# adds nothing new to the workspace.
flate2 = "1"
lz4_flex = "0.11"
soe-audio = { path = "../crates/audio", default-features = false }
soe-profile = { path = "../crates/profile" }
soe-moddata = { path = "../crates/moddata" }

[dependencies.soe-esm]
path = "../crates/esm"

[dependencies.soe-bsa]
path = "../crates/bsa"

[dependencies.soe-nif]
path = "../crates/nif"

[dependencies.soe-havok]
path = "../crates/havok"

[dependencies.soe-dds]
path = "../crates/dds"

[dependencies.soe-papyrus]
path = "../crates/papyrus"

[dependencies.soe-save]
path = "../crates/save"

[[bin]]
name = "fuzz-esm"
path = "fuzz_targets/fuzz_esm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-bsa"
path = "fuzz_targets/fuzz_bsa.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-nif"
path = "fuzz_targets/fuzz_nif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-havok"
path = "fuzz_targets/fuzz_havok.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-dds"
path = "fuzz_targets/fuzz_dds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-pex"
path = "fuzz_targets/fuzz_pex.rs"
test = false
doc = false
bench = false

# Structure aware, next to the byte targets rather than replacing them. The
# byte targets reach the parser's error paths, these two reach the code behind
# a script that actually loads.
[[bin]]
name = "fuzz-pex-grammar"
path = "fuzz_targets/fuzz_pex_grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-vm-run"
path = "fuzz_targets/fuzz_vm_run.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-save"
path = "fuzz_targets/fuzz_save.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-dds-grammar"
path = "fuzz_targets/fuzz_dds_grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-bsa-grammar"
path = "fuzz_targets/fuzz_bsa_grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-audio"
path = "fuzz_targets/fuzz_audio.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-profile"
path = "fuzz_targets/fuzz_profile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-moddata"
path = "fuzz_targets/fuzz_moddata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-vm-state"
path = "fuzz_targets/fuzz_vm_state.rs"
test = false
doc = false
bench = false
