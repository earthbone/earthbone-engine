name: lint

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      # ubuntu-latest ships Node, so npx is available for the two optional
      # formatters tools/lint.sh guards with `command -v`. comment-lint is a
      # local personal tool, not installed here, so ~/.local/bin/comment-lint
      # stays absent and that step's guard skips it, matching every other
      # machine that does not have it.
      - name: Install taplo and markdownlint-cli2
        run: |
          npm install -g @taplo/cli markdownlint-cli2

      - name: Run the lint gate
        run: tools/lint.sh
