name: synthetic performance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: perf-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build synthetic workloads
        run: cargo build -p soe-bench --profile thin --locked
      - name: Check mixed workload
        run: >-
          python3 tools/performance.py check --binary target/thin/soe-bench
          --scenario mixed --start 8 --samples 120 --repeats 2
          --p99-ms 100 --worst-ms 500 --max-rss-mib 512
          --out performance-results/mixed
      - name: Check a thousand moving actors
        if: ${{ !cancelled() }}
        run: >-
          python3 tools/performance.py check --binary target/thin/soe-bench
          --scenario actors --start 1000 --samples 120 --repeats 2
          --p99-ms 100 --worst-ms 500 --max-rss-mib 512
          --out performance-results/actors
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-performance
          path: performance-results/
